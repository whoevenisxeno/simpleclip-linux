[package]
name = "scd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scd"
path = "src/main.rs"

[dependencies]
sc-core.workspace = true
sc-capture = { path = "../sc-capture" }
sc-ffmpeg = { path = "../sc-ffmpeg" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
interprocess.workspace = true
notify.workspace = true
crossbeam-channel.workspace = true
directories.workspace = true
png = "0.18.1"
libc = "0.2"
pollster = "1"
ashpd = { version = "0.13", default-features = false, features = ["global_shortcuts", "async-io"] }
async-io = "2"
futures-util = "0.3"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
tiny-skia = "0.11"
fontdue = "0.9"
